[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waymo-mcp"
version = "0.1.0"
description = "Unofficial MCP server for managing Waymo rides"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nathaniel Angafor" }]
keywords = ["mcp", "waymo", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "blackboxprotobuf>=1.0",
  "gpsoauth>=3,<4",
  "grpcio>=1.60",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
waymo-mcp = "waymo_mcp.server:main"

[project.urls]
Homepage = "https://github.com/nathanielangafor/waymo-mcp"
Repository = "https://github.com/nathanielangafor/waymo-mcp"
Issues = "https://github.com/nathanielangafor/waymo-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/waymo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
